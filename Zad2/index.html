<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Task 2 - Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
         rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="skrypt.js"></script>
</head>

<body>
<div class="container mt-4">

    <h1>Task 2 - Recipes</h1>

    <form class="mb-4" onsubmit="return false">
        <div class="mb-3">
            <label for="search" class="form-label">Filter by name: </label>
            <input type="text" id="search" class="form-control">
        </div>
        <div class="mb-3">
            <label for="difficulty" class="form-label">Choose difficulty: </label>
            <select id="difficulty" class="form-select"></select>
        </div>
        <div class="mb-3">
            <label for="cuisine" class="form-label">Choose cuisine: </label>
            <select id="cuisine" class="form-select"></select>
        </div>
        <div class="mb-3">
            <label for="slider" class="form-label">Choose prepatarion time limit: </label>
            <input type="range" id="slider" min="0" max="60" class="form-range"/>
            <p id="range_val">60</p>
        </div>
        
        <label for="reset" class="form-label">Reset filters:</label>
        <input type="reset" value="RESET" id="reset" class="btn btn-secondary" />
    </form>

    <h2>Recipes found: <span id="found"></span></h2>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Cuisine</th>
            <th>Difficulty</th>
            <th>Preparation time</th>
            <th>Rating</th>
            <th></th>
        </tr>
        </thead>

        <tbody id="tab">
        </tbody>
    </table>


    <!-- Modal do szczegolow -->
    <div class="modal fade" id="recipeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
</div>

</div>

</body>
</html>
